name: Deploy Production — CANKORA PMO

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Build & Validate ─────────────────────────────────────────────────────
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Go build check
        working-directory: backend
        run: CGO_ENABLED=0 go build ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

  # ── 2. Deploy to VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "=== CANKORA PMO — Production Deploy $(date '+%Y-%m-%d %H:%M:%S') ==="
            cd /root/cankonix-node/apps/cankonix-pmo
            git remote set-url origin https://github.com/cankonix-squad/PMO.git
            git fetch origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 2m
          envs: PROD_SMOKE_EMAIL,PROD_SMOKE_PASSWORD
          script: |
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://pmo.cankonix.com/api/health || echo "000")
            echo "API health HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "ERROR: Health check failed with HTTP $HTTP_STATUS"
              exit 1
            fi

            if [ -n "${PROD_SMOKE_EMAIL:-}" ] && [ -n "${PROD_SMOKE_PASSWORD:-}" ]; then
              LOGIN_PAYLOAD=$(printf '{"email":"%s","password":"%s"}' "$PROD_SMOKE_EMAIL" "$PROD_SMOKE_PASSWORD")
              LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST https://pmo.cankonix.com/api/v1/auth/login \
                -H "Content-Type: application/json" \
                -d "$LOGIN_PAYLOAD" || echo "000")
              echo "Smoke login HTTP status: $LOGIN_STATUS"
              if [ "$LOGIN_STATUS" != "200" ]; then
                echo "ERROR: Smoke login check failed with HTTP $LOGIN_STATUS"
                exit 1
              fi
            else
              echo "WARNING: PROD_SMOKE_EMAIL/PROD_SMOKE_PASSWORD not set; skipping smoke login check"
            fi
            echo "Deployment verified: pmo.cankonix.com is healthy"
        env:
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
